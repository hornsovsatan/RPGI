	uniform.vec3.gbufferProjection0 = vec3(gbufferProjection.0.0, gbufferProjection.1.1, gbufferProjection.2.2)
	uniform.vec3.gbufferProjection1 = vec3(gbufferProjection.3.0, gbufferProjection.3.1, gbufferProjection.3.2)

	uniform.vec4.gbufferProjectionInverse0 = vec4(gbufferProjectionInverse.0.0, gbufferProjectionInverse.1.1, gbufferProjectionInverse.2.3, gbufferProjectionInverse.3.3)
	uniform.vec3.gbufferProjectionInverse1 = vec3(gbufferProjectionInverse.3.0, gbufferProjectionInverse.3.1, gbufferProjectionInverse.3.2)

	uniform.vec3.gbufferPreviousProjection0 = vec3(gbufferPreviousProjection.0.0, gbufferPreviousProjection.1.1, gbufferPreviousProjection.2.2)
	uniform.vec3.gbufferPreviousProjection1 = vec3(gbufferPreviousProjection.3.0, gbufferPreviousProjection.3.1, gbufferPreviousProjection.3.2)

#endif

