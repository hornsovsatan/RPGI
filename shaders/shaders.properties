	uniform.vec3.lodProjectionInverse1 = vec3(dhProjectionInverse.3.0, dhProjectionInverse.3.1, dhProjectionInverse.3.2)
	uniform.vec2.lodPreviousProjection0 = vec2(dhPreviousProjection.2.2, dhPreviousProjection.3.2)
