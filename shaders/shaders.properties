	uniform.vec3.lodProjectionInverse1 = vec3(vxProjInv.3.0, vxProjInv.3.1, vxProjInv.3.2)
	uniform.vec2.lodPreviousProjection0 = vec2(vxProjPrev.2.2, vxProjPrev.3.2)
#endif


variable.float.rotZAngle = 1.107148718 - atan2(shadowModelView.1.1, shadowModelView.1.0)
variable.float.cosRotZ = cos(rotZAngle) * 0.7071067812
variable.float.sinRotZ = sin(rotZAngle) * 0.7071067812

variable.float.shadowModelView00Z = shadowModelView.0.0 * cosRotZ + shadowModelView.0.1 * -sinRotZ
variable.float.shadowModelView10Z = shadowModelView.1.0 * cosRotZ + shadowModelView.1.1 * -sinRotZ
variable.float.shadowModelView20Z = shadowModelView.2.0 * cosRotZ + shadowModelView.2.1 * -sinRotZ
variable.float.shadowModelView01Z = shadowModelView.0.0 * sinRotZ + shadowModelView.0.1 * cosRotZ
variable.float.shadowModelView11Z = shadowModelView.1.0 * sinRotZ + shadowModelView.1.1 * cosRotZ
variable.float.shadowModelView21Z = shadowModelView.2.0 * sinRotZ + shadowModelView.2.1 * cosRotZ
variable.float.shadowModelView02Z = shadowModelView.0.2
variable.float.shadowModelView12Z = shadowModelView.1.2
variable.float.shadowModelView22Z = shadowModelView.2.2

variable.float.rotYAngle = SUNRISE_ROTATION * 0.01745329252
variable.float.cosRotY = cos(rotYAngle)
variable.float.sinRotY = sin(rotYAngle)

variable.float.shadowModelView00 = shadowModelView00Z * cosRotY + shadowModelView20Z * -sinRotY
variable.float.shadowModelView01 = shadowModelView01Z * cosRotY + shadowModelView21Z * -sinRotY
variable.float.shadowModelView02 = shadowModelView02Z * cosRotY + shadowModelView22Z * -sinRotY
variable.float.shadowModelView10 = shadowModelView10Z
variable.float.shadowModelView11 = shadowModelView11Z
variable.float.shadowModelView12 = shadowModelView12Z
variable.float.shadowModelView20 = shadowModelView00Z * sinRotY + shadowModelView20Z * cosRotY
variable.float.shadowModelView21 = shadowModelView01Z * sinRotY + shadowModelView21Z * cosRotY
variable.float.shadowModelView22 = shadowModelView02Z * sinRotY + shadowModelView22Z * cosRotY


#variable.float.cameraPositionMod4X = (cameraPositionInt.x % 4) + cameraPositionFract.x
#variable.float.cameraPositionMod4Y = (cameraPositionInt.y % 4) + cameraPositionFract.y
#variable.float.cameraPositionMod4Z = (cameraPositionInt.z % 4) + cameraPositionFract.z
