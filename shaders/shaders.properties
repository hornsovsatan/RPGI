#variable.float.shadowModelView31 = shadowModelView01 * cameraPositionMod4X + shadowModelView11 * cameraPositionMod4Y + shadowModelView21 * cameraPositionMod4Z
#variable.float.shadowModelView32 = shadowModelView02 * cameraPositionMod4X + shadowModelView12 * cameraPositionMod4Y + shadowModelView22 * cameraPositionMod4Z

uniform.vec3.shadowModelView0 = vec3(shadowModelView00, shadowModelView01, shadowModelView02)
uniform.vec3.shadowModelView1 = vec3(shadowModelView10, shadowModelView11, shadowModelView12)
uniform.vec3.shadowModelView2 = vec3(shadowModelView20, shadowModelView21, shadowModelView22)
#uniform.vec3.shadowModelView3 = vec3(shadowModelView30, shadowModelView31, shadowModelView32)

uniform.vec3.shadowModelViewInverse2 = vec3(shadowModelView02, shadowModelView12, shadowModelView22)

variable.int.cameraPositionIntToPrevX = cameraPositionInt.x - previousCameraPositionInt.x
variable.int.cameraPositionIntToPrevY = cameraPositionInt.y - previousCameraPositionInt.y
variable.int.cameraPositionIntToPrevZ = cameraPositionInt.z - previousCameraPositionInt.z
variable.float.cameraPositionToPrevX = cameraPositionFract.x - previousCameraPositionFract.x + cameraPositionIntToPrevX
variable.float.cameraPositionToPrevY = cameraPositionFract.y - previousCameraPositionFract.y + cameraPositionIntToPrevY
variable.float.cameraPositionToPrevZ = cameraPositionFract.z - previousCameraPositionFract.z + cameraPositionIntToPrevZ
uniform.vec3.cameraPositionToPrevious = vec3(cameraPositionToPrevX, cameraPositionToPrevY, cameraPositionToPrevZ)

#ifdef RENDERING_MODE
variable.bool.modelViewVaildation = gbufferModelView.2.0 == gbufferPreviousModelView.2.0 && gbufferModelView.2.1 == gbufferPreviousModelView.2.1 && gbufferModelView.2.2 == gbufferPreviousModelView.2.2
#else
variable.bool.modelViewVaildation = (gbufferModelView.2.0 * gbufferPreviousModelView.2.0 + gbufferModelView.2.1 * gbufferPreviousModelView.2.1 + gbufferModelView.2.2 * gbufferPreviousModelView.2.2) > (1.0 - 0.000005 / gbufferProjection.1.1)
#endif
variable.bool.projectionVaildation = gbufferProjection.1.1 == gbufferPreviousProjection.1.1
variable.bool.cameraPosVaildation = (abs(cameraPositionToPrevX) + abs(cameraPositionToPrevY) + abs(cameraPositionToPrevZ)) < 0.000001

variable.bool.motionVaildation = modelViewVaildation && projectionVaildation && cameraPosVaildation


#ifdef RENDERING_MODE
	#ifdef RENDERING_MODE_MOTION_VALIDATION
		uniform.bool.rtwDiscardRefresh = motionVaildation
	#else
		uniform.bool.rtwDiscardRefresh = 1 == 1
	#endif

#else
	#if SR_SHOULD_APPLY_SCALE == 1
		variable.float.ffc = frameCounter
		variable.bool.frameVaildation = fmod(ffc, floor(256.0 / SR_JITTER_SEQUENCE_LENGTH) * SR_JITTER_SEQUENCE_LENGTH) != 6.0

	#else
		#if FSR2_SCALE >= 0
			#if FSR2_SCALE == 0
				variable.bool.frameVaildation = (frameCounter % 256) != 6
			#elif FSR2_SCALE == 1
				variable.bool.frameVaildation = (frameCounter % 252) != 6
			#elif FSR2_SCALE == 2
				variable.bool.frameVaildation = (frameCounter % 253) != 6
			#elif FSR2_SCALE == 3
				variable.bool.frameVaildation = (frameCounter % 256) != 6
			#elif FSR2_SCALE == 4
				variable.bool.frameVaildation = (frameCounter % 288) != 6
			#endif
		#else
			variable.bool.frameVaildation = (frameCounter % 256) != 6
		#endif
	#endif

	uniform.bool.rtwDiscardRefresh = motionVaildation && frameVaildation
#endif


uniform.float.eyeBrightnessSmoothCurved = smooth(6,  pow(clamp(eyeBrightness.y * 0.00527, 0.0, 1.0), 6.0), 7.0, 5.0)
variable.float.eyeBrightnessZero        = smooth(7,  if(eyeBrightness.y == 0,      1.0, 0.0), 6.0, 0.0)
uniform.float.eyeBrightnessZeroSmooth   = smooth(8,  if(eyeBrightnessZero > 0.99,  1.0, 0.0), 5.0, 2.0)
uniform.float.eyeBrightnessOneSmooth    = smooth(9,  if(eyeBrightness.y == 240,    1.0, 0.0), 4.0, 4.0)
uniform.float.eyeSnowySmooth            = smooth(10, if(biome_precipitation > 1.5, 1.0, 0.0), 4.0, 7.0)
uniform.float.eyeNoPrecipitationSmooth  = smooth(11, if(biome_precipitation < 0.5, 1.0, 0.0), 7.0, 7.0)

variable.float.frameTimeFactor = 0.003183099 / if(frameTime == 0, 5, frameTime)
variable.float.angleRx = asin(gbufferModelView.1.1 * gbufferPreviousModelView.1.2 - gbufferModelView.1.2 * gbufferPreviousModelView.1.1) * frameTimeFactor
variable.float.angleRy = asin(gbufferModelView.0.2 * gbufferPreviousModelView.0.0 - gbufferModelView.0.0 * gbufferPreviousModelView.0.2) * frameTimeFactor
uniform.float.eyeRxSmooth = smooth(12, angleRx, 0.7, 0.7)
uniform.float.eyeRySmooth = smooth(13, angleRy, 0.7, 0.7)

