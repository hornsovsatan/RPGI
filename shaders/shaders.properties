#endif



#ifdef CUSTOM_RENDER_RESOLUTION
	variable.float.aspectRatioMul =  viewWidth / viewHeight / CUSTOM_RENDER_RESOLUTION_X * CUSTOM_RENDER_RESOLUTION_Y * ASPECTRATIO_MUL
	variable.float.fovMul = 1.0 / min(aspectRatioMul, 1.0)
	uniform.vec3.gbufferProjection0 = vec3(gbufferProjection.0.0 * aspectRatioMul * fovMul, gbufferProjection.1.1 * fovMul, gbufferProjection.2.2)
	uniform.vec3.gbufferProjection1 = vec3(gbufferProjection.3.0, gbufferProjection.3.1, gbufferProjection.3.2)

	uniform.vec4.gbufferProjectionInverse0 = vec4(gbufferProjectionInverse.0.0 / aspectRatioMul / fovMul, gbufferProjectionInverse.1.1 / fovMul, gbufferProjectionInverse.2.3, gbufferProjectionInverse.3.3)
	uniform.vec3.gbufferProjectionInverse1 = vec3(gbufferProjectionInverse.3.0, gbufferProjectionInverse.3.1, gbufferProjectionInverse.3.2)

	uniform.vec3.gbufferPreviousProjection0 = vec3(gbufferPreviousProjection.0.0 * aspectRatioMul * fovMul, gbufferPreviousProjection.1.1 * fovMul, gbufferPreviousProjection.2.2)
	uniform.vec3.gbufferPreviousProjection1 = vec3(gbufferPreviousProjection.3.0, gbufferPreviousProjection.3.1, gbufferPreviousProjection.3.2)

